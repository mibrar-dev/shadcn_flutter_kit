# Docs app for flutter_shadcn_kit (Flutter web, GitHub Pages).
#
# Dependency policy (P6 docs rebuild):
#  * Widgets-only: nothing here may pull `material.dart` / `cupertino.dart`
#    into the app; the `grep -rnE` gate in CI enforces it.
#  * Registry components are NOT pubspec dependencies: they are copied into
#    `lib/ui/shadcn/` by the CLI (`flutter_shadcn init` + `add --all`). Until
#    the CLI lands, `tool/sync_registry.sh` mirrors the registry tree.
#  * Every dependency below has a one-line justification. Re-adding a removed
#    dep (go_router, syntax_highlight, shared_preferences, font_awesome, …)
#    requires the same.

name: docs
description: Flutter web docs for flutter_shadcn_kit, built on the post-cutover registry.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  # The registry `app` component installs ShadcnLocalizations and
  # GlobalWidgetsLocalizations; without this the shell cannot compile.
  flutter_localizations:
    sdk: flutter
  # Used by registry localizations / previews; flutter_localizations pins the
  # version, `any` avoids skew.
  intl: any
  # web_bridge: DOM custom events, localStorage persistence and the
  # prefers-reduced-motion probe — web only, via conditional import. Chosen
  # over shared_preferences so the app stays plugin-free.
  web: ^1.1.1
  # `components/formatter/formatter.dart` imports it; pure Dart, no widgets.
  expressions: ^0.2.5+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Build-time only: docs/tool/gen_docs_data.dart parses registry sources with
  # `parseString`. Never shipped in main.dart.js.
  analyzer: ^14.0.0

flutter:
  # No `uses-material-design`: the kit is widgets-only; Material icons and
  # fonts are deliberately not bundled.
  fonts:
    - family: LucideIcons
      fonts:
        - asset: assets/fonts/lucide.ttf
    - family: RadixIcons
      fonts:
        - asset: assets/fonts/radix.otf
    - family: BootstrapIcons
      fonts:
        - asset: assets/fonts/bootstrap.otf
    - family: NotoSansSymbols2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf
    - family: GeistSans
      fonts:
        - asset: assets/fonts/Geist-Black.otf
          weight: 800
        - asset: assets/fonts/Geist-BlackItalic.otf
          weight: 800
          style: italic
        - asset: assets/fonts/Geist-Bold.otf
          weight: 700
        - asset: assets/fonts/Geist-BoldItalic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/Geist-ExtraLightItalic.otf
          weight: 200
          style: italic
        - asset: assets/fonts/Geist-Light.otf
          weight: 300
        - asset: assets/fonts/Geist-LightItalic.otf
          weight: 300
          style: italic
        - asset: assets/fonts/Geist-Medium.otf
          weight: 500
        - asset: assets/fonts/Geist-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/Geist-Regular.otf
          weight: 400
        - asset: assets/fonts/Geist-RegularItalic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/Geist-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Geist-SemiBoldItalic.otf
          weight: 600
          style: italic
        - asset: assets/fonts/Geist-Thin.otf
          weight: 100
        - asset: assets/fonts/Geist-ThinItalic.otf
          weight: 100
          style: italic
        - asset: assets/fonts/Geist-UltraBlack.otf
          weight: 900
        - asset: assets/fonts/Geist-UltraLight.otf
          weight: 200
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Black.otf
          weight: 800
        - asset: assets/fonts/GeistMono-BlackItalic.otf
