<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A shadcn/ui-style design system for Flutter. Copy-paste components, token theming, 42 presets — widgets-only.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="shadcn_flutter_kit docs">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>shadcn_flutter_kit — docs</title>
  <link rel="manifest" href="manifest.json">

  <!--
    First-paint placeholder. Self-contained (no images, no CDN): the old
    standard.js loader shipped 536K of component screenshots and hard-coded
    component names, both removed with the old docs app. Removed on
    `flutter-first-frame`.
  -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #171717;
      color: #e5e5e5;
      font-family: "Geist Sans", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }
    #docs-first-paint {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    #docs-first-paint strong {
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    #docs-first-paint span {
      font-size: 14px;
      color: #a3a3a3;
      animation: docs-pulse 1.6s ease-in-out infinite;
    }
    @keyframes docs-pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #docs-first-paint span { animation: none; opacity: 1; }
    }
  </style>
  <script>
    // Drop the placeholder as soon as Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var placeholder = document.getElementById('docs-first-paint');
      if (placeholder) {
        placeholder.remove();
      }
    });
  </script>
</head>
<body>
  <div id="docs-first-paint">
    <strong>shadcn_flutter_kit</strong>
    <span>Loading docs…</span>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
