# Analyzer configuration for flutter_shadcn_kit.
#
# This file deliberately uses ONLY `package:flutter_lints/flutter.yaml` — the
# exact lint set a fresh `flutter create` app ships with. The registry is
# copy/pasted verbatim into user apps by `flutter_shadcn add`, so anything the
# registry suppresses here would surface as an analyzer error in every
# installed project. Registry code must be clean under a stock app's lints;
# there are no per-package relaxations and no `// ignore:` comments.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - flutter_cli_verification_example/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Intentional-violation fixtures for the guardrail tests: they carry unused
    # imports (and a Material import) on purpose, so the layer/owner checkers
    # have something to reject. The checkers parse them directly; they are not
    # linted as production code.
    - test/rearch/fixtures/**

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
