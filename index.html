<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/dashcn/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="dashcn — Flutter components for every platform. Use it as a package or own the code: token theming, 42 presets, widgets-only.">
  <meta name="theme-color" content="#09090B">

  <!-- Social cards -->
  <meta property="og:title" content="dashcn">
  <meta property="og:description" content="Flutter components for every platform.">
  <meta property="og:image" content="og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="dashcn">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" href="favicon.ico" sizes="any"/>

  <title>dashcn</title>
  <link rel="manifest" href="manifest.json">

  <!--
    First-paint placeholder. Self-contained (no images, no CDN): the old
    standard.js loader shipped 536K of component screenshots and hard-coded
    component names, both removed with the old docs app. Removed on
    `flutter-first-frame`.
  -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #171717;
      color: #e5e5e5;
      font-family: "Geist Sans", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }
    /* First paint before the app reports its theme: follow the system mode so
       a light-mode visitor never sees a dark flash. The app then sets the
       exact preset colours through `dashcn_theme_changed`. */
    @media (prefers-color-scheme: light) {
      html, body {
        background: #ffffff;
        color: #000000;
      }
      #docs-first-paint span {
        color: #737373;
      }
    }
    #docs-first-paint {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    #docs-first-paint strong {
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    #docs-first-paint span {
      font-size: 14px;
      color: #a3a3a3;
      animation: docs-pulse 1.6s ease-in-out infinite;
    }
    @keyframes docs-pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #docs-first-paint span { animation: none; opacity: 1; }
    }
  </style>
  <script>
    // Fall back to en-US when the browser reports no usable locale (P9-Z).
    //
    // Headless Chromium without LANG reports `navigator.language === 'C'`
    // (or an empty/odd tag); the Flutter engine feeds that string straight
    // into a Locale constructor, which throws `RangeError: Incorrect locale
    // information provided` and kills boot before the first frame. The
    // kit's own locale resolution already falls back to English for every
    // Locale object — this shim only repairs the browser string the engine
    // parses, before `flutter_bootstrap.js` loads.
    (function () {
      function usable(value) {
        if (typeof value !== 'string' || value.length < 2) {
          return false;
        }
        try {
          if (typeof Intl !== 'undefined' && Intl.Locale) {
            new Intl.Locale(value);
            return true;
          }
        } catch (_) {
          return false;
        }
        return /^[A-Za-z]{2,3}([-_][A-Za-z0-9]{2,8})*$/.test(value);
      }
      try {
        var nav = window.navigator;
        if (!nav) {
          return;
        }
        var ok =
          usable(nav.language) &&
          Array.isArray(nav.languages) &&
          nav.languages.length > 0 &&
          usable(nav.languages[0]);
        if (!ok) {
          Object.defineProperty(nav, 'language', {
            configurable: true,
            get: function () {
              return 'en-US';
            },
          });
          Object.defineProperty(nav, 'languages', {
            configurable: true,
            get: function () {
              return ['en-US'];
            },
          });
        }
      } catch (_) {
        // A sealed navigator keeps the old values; boot then fails exactly
        // as before (no new failure mode introduced).
      }
    })();
  </script>
  <script>
    // Drop the placeholder as soon as Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var placeholder = document.getElementById('docs-first-paint');
      if (placeholder) {
        placeholder.remove();
      }
    });
    // Keep the page background in sync with the active preset/mode so any
    // area Flutter does not paint (overscroll, resize gaps) matches the app.
    window.addEventListener('dashcn_theme_changed', function (event) {
      var detail = event.detail || {};
      if (detail.background) {
        document.documentElement.style.background = detail.background;
        document.body.style.background = detail.background;
      }
      if (detail.foreground) {
        document.body.style.color = detail.foreground;
      }
    });
  </script>
</head>
<body>
  <div id="docs-first-paint">
    <strong>dashcn</strong>
    <span>Loading docs…</span>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
